<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='menu.css') }}">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="{{ url_for('index') }}">Home</a></li>
                <li><a href="{{ url_for('boletim') }}">Boletim</a></li>
                <li><a href="{{ url_for('anotacoes') }}">Anotações</a></li>
                <li><a href="{{ url_for('sobremim') }}">Sobre mim</a></li>
                <li><a href="{{ url_for('logout') }}">Sair ({{ session['nome_usuario'] }})</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Anotações pessoais</h1>
        {% for registro in registros %}
            <section>
                <h2>{{ registro['titulo'] }}</h2>
                <p>{{ registro['conteudo'] }}</p>
            </section>
        {% else %}
            <p>Nenhuma anotação cadastrada.</p>
        {% endfor %}
    </main>
</body>
</html>
